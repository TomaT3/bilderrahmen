# Vorlage für /volume1/docker/bilderrahmen/config/devices.yaml
# Das Passwort je Gerät steht nicht hier, sondern in der Umgebungsvariable FRAME_PASSWORD_<ID>
# (ID in Großbuchstaben, "-" wird "_"), z. B. FRAME_PASSWORD_OMA_OPA. Benutzername im Rahmen = id.
timezone: Europe/Berlin
devices:
  - id: oma-opa                 # a-z, 0-9, "-"; erscheint in der URL
    album: Rahmen Oma+Opa       # Albumname in Synology Photos (eigenes oder mit dem Benutzer geteiltes Album)
    orientation: landscape      # landscape (Standard) = Rahmen steht quer, portrait = hochkant
    wake: "06:00"               # Uhrzeit (Europe/Berlin), zu der das neue Bild kommt
