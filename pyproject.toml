[project]
name = "bilderrahmen"
version = "0.1.0"
description = "Liefert pro E-Ink-Rahmen (OpenPaper L) täglich ein zufälliges Foto aus einem Synology-Photos-Album."
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "pillow==13.0.0",
    "pillow-heif==1.8.1",
    "httpx==0.28.1",
    "pyyaml==6.0.4",
    "tzdata==2026.6",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
